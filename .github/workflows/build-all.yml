  # ── Windows x64 ────────────────────────────────────────────────────────────
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'windows'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps + PyInstaller
        run: pip install -q pyinstaller -r client/requirements.txt

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2 --global
          wix extension add WixToolset.Util.wixext/5.0.2 --global

      - name: Build .NET AOT (win-x64)
        run: |
          dotnet publish src/P2L.CLI `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishAot=true `
            -p:InvariantGlobalization=true `
            -p:StripSymbols=true `
            -o artifacts/win-x64

      - name: Build p2l-client.exe (PyInstaller)
        run: |
          pyinstaller --onefile --name p2l-client `
            --distpath artifacts/win-x64 `
            --workpath .pyinstaller-work `
            --specpath .pyinstaller-work `
            client/run.py

      - name: Verify binaries
        run: |
          @('p2l.exe', 'p2l-client.exe', 'e_sqlite3.dll') | ForEach-Object {
            $p = "artifacts/win-x64/$_"
            if (-not (Test-Path $p)) { throw "Missing: $p" }
            "$_ — $([math]::Round((Get-Item $p).Length/1MB,1)) MB"
          }

      - name: Build MSI (WiX 5)
        run: |
          dotnet build deploy/P2L.Installer/P2L.Installer.wixproj `
            -c Release `
            -p:Platform=x64 `
            -p:ProductVersion=${{ env.VERSION }} `
            "-p:BinaryPath=$(Resolve-Path 'artifacts/win-x64')" `
            "-p:ConfigPath=$(Resolve-Path 'deploy/P2L.Installer/Assets')" `
            "-p:LicenseRtf=$(Resolve-Path 'deploy/P2L.Installer/Assets/License.rtf')" `
            -o dist

      - name: Create zip archive
        run: |
          $v = "${{ env.VERSION }}"
          $staging = "dist/staging/p2l-$v-win-x64"
          New-Item -ItemType Directory -Force "$staging/bin","$staging/config" | Out-Null
          Copy-Item artifacts/win-x64/p2l.exe        "$staging/bin/"
          Copy-Item artifacts/win-x64/p2l-client.exe "$staging/bin/"
          Copy-Item artifacts/win-x64/e_sqlite3.dll  "$staging/bin/"
          Copy-Item appsettings.json                 "$staging/config/"
          Compress-Archive -Path $staging -DestinationPath "dist/p2l-$v-win-x64.zip" -Force
          Get-ChildItem dist -File | ForEach-Object { "$($_.Name) — $([math]::Round($_.Length/1MB,1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: p2l-${{ env.VERSION }}-win-x64
          path: |
            dist/*.msi
            dist/*.zip
          retention-days: 30

  # ── GitHub Release (on tag v*) ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-x64, linux-arm64, osx-arm64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "P2L ${{ env.VERSION }}"
          files: release-assets/**
          body: |
            ## Pick2Light ${{ env.VERSION }}

            | Platform | Download |
            |----------|----------|
            | Windows x64 | `P2L-${{ env.VERSION }}-x64.msi` (installer) · `.zip` |
            | Linux x64   | `p2l-${{ env.VERSION }}-linux-x64.tar.gz` |
            | Linux arm64 | `p2l-${{ env.VERSION }}-linux-arm64.tar.gz` |
            | macOS arm64 | `p2l-${{ env.VERSION }}-osx-arm64.tar.gz` |
            | macOS x64   | `p2l-${{ env.VERSION }}-osx-x64.tar.gz` |

            ### Windows silent install
            ```cmd
            msiexec /i P2L-${{ env.VERSION }}-x64.msi /qn
            ```

            ### Linux install
            ```bash
            tar -xzf p2l-${{ env.VERSION }}-linux-x64.tar.gz
            sudo ./p2l-${{ env.VERSION }}-linux-x64/deploy/install.sh
            ```
