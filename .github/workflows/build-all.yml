name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        default: '1.0.3'
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
          - runtime: osx-x64
            runner: macos-15-intel
          - runtime: osx-arm64
            runner: macos-15
          - runtime: win-x64
            runner: windows-latest
          - runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check license defaults (local HTTP fixture)
        run: dotnet run --project tests/P2L.LicensingTests -c Release -p:PublishAot=false
      - name: Check bundled SQLite and embedded web resources (local fixtures)
        run: dotnet publish tests/P2L.WebTests -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:DebugSymbols=false -o artifacts/web-smoke
      - name: Run bundled resource checks
        run: python -c "import pathlib, subprocess; d = pathlib.Path('artifacts/web-smoke').resolve(); p = d / ('P2L.WebTests.exe' if '${{ matrix.runtime }}'.startswith('win-') else 'P2L.WebTests'); subprocess.run([str(p)], cwd=d, check=True, timeout=120)"
      - name: Publish standalone executable
        run: dotnet publish src/P2L.CLI -c Release -r ${{ matrix.runtime }} -p:PublishProfile=singlefile -p:DebugType=embedded -p:DebugSymbols=false -p:Version=${{ env.VERSION }} -o artifacts/${{ matrix.runtime }}
      - name: Verify standalone startup and package executable with PDF
        run: python deploy/package-release.py --runtime ${{ matrix.runtime }} --version ${{ env.VERSION }} --publish-dir artifacts/${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: p2l-${{ env.VERSION }}-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.value }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: p2l-${{ env.VERSION }}-*
          merge-multiple: true
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 6
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --verify-tag --title "P2L $VERSION" --notes 'Standalone P2L for Windows, Linux and macOS (x64 / ARM64). Each ZIP contains one executable and a simple Vietnamese PDF covering license activation and Terminal use. Default license service: https://auth-supra.winmart.vn; P2L_LICENSE_API_URL can override it.'
