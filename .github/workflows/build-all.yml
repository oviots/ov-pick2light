      - name: Build p2l-client (PyInstaller)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pyinstaller -r client/requirements.txt
          .venv/bin/pyinstaller --onefile --name p2l-client \
            --distpath artifacts/linux-arm64 \
            --workpath .pyinstaller-work \
            --specpath .pyinstaller-work \
            client/run.py

      - name: Package tar.gz
        run: |
          VERSION=${{ env.VERSION }}
          STAGING="dist/staging/p2l-${VERSION}-linux-arm64"
          mkdir -p "$STAGING/bin" "$STAGING/config" "$STAGING/deploy"
          cp artifacts/linux-arm64/p2l            "$STAGING/bin/"
          cp artifacts/linux-arm64/p2l-client     "$STAGING/bin/"
          cp artifacts/linux-arm64/libe_sqlite3.so "$STAGING/bin/" 2>/dev/null || true
          cp appsettings.json                      "$STAGING/config/"
          cp deploy/install.sh                     "$STAGING/deploy/" 2>/dev/null || true
          cp deploy/p2l.service                    "$STAGING/deploy/" 2>/dev/null || true
          cp deploy/p2l-client.service             "$STAGING/deploy/" 2>/dev/null || true
          mkdir -p dist
          tar -czf "dist/p2l-${VERSION}-linux-arm64.tar.gz" -C "dist/staging" "p2l-${VERSION}-linux-arm64"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: p2l-${{ env.VERSION }}-linux-arm64
          path: dist/p2l-*-linux-arm64.tar.gz
          retention-days: 30

  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  osx-arm64:
    name: macOS arm64
    runs-on: macos-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'macos'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Homebrew deps (OpenSSL + Brotli for AOT linker)
        run: brew install openssl@3 brotli

      - name: Build .NET AOT (osx-arm64)
        run: |
          export LIBRARY_PATH="$(brew --prefix openssl@3)/lib:$(brew --prefix brotli)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          dotnet publish src/P2L.CLI \
            -c Release -r osx-arm64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:StripSymbols=true \
            -o artifacts/osx-arm64

      - name: Build p2l-client (PyInstaller)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pyinstaller -r client/requirements.txt
