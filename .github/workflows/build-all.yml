          tar -czf "dist/p2l-${VERSION}-osx-arm64.tar.gz" -C "dist/staging" "p2l-${VERSION}-osx-arm64"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: p2l-${{ env.VERSION }}-osx-arm64
          path: dist/p2l-*-osx-arm64.tar.gz
          retention-days: 30

