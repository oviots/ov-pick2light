# .github/workflows/build-all.yml
# Cross-platform build: Linux x64/arm64, macOS arm64/x64, Windows x64
#
# Trigger:
#   - Manual: Actions → "Build All Platforms" → Run workflow
#   - Tag:    git tag v1.0.0 && git push origin v1.0.0
#
# Outputs (GitHub Artifacts + Release on tag):
#   p2l-<version>-linux-x64.tar.gz
#   p2l-<version>-linux-arm64.tar.gz
#   p2l-<version>-osx-arm64.tar.gz
#   p2l-<version>-osx-x64.tar.gz
#   p2l-<version>-win-x64.zip
#   P2L-<version>-x64.msi

name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      targets:
        description: "Platforms to build"
        required: true
        default: all
        type: choice
        options: [all, linux, windows, macos]
  push:
    tags:
      - "v*"

env:
  VERSION: ${{ github.event.inputs.version || '1.0.0' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Linux x64 ──────────────────────────────────────────────────────────────
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'push' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'linux'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get install -y python3-dev

      - name: Build .NET AOT (linux-x64)
        run: |
          dotnet publish src/P2L.CLI \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:StripSymbols=true \
            -p:UsePortableLinuxSharedLibraries=true \
            -o artifacts/linux-x64

      - name: Build p2l-client (PyInstaller)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pyinstaller -r client/requirements.txt
          .venv/bin/pyinstaller --onefile --name p2l-client \
            --distpath artifacts/linux-x64 \
            --workpath .pyinstaller-work \
            --specpath .pyinstaller-work \
            client/run.py

      - name: Package tar.gz
        run: |
          VERSION=${{ env.VERSION }}
          STAGING="dist/staging/p2l-${VERSION}-linux-x64"
          mkdir -p "$STAGING/bin" "$STAGING/config" "$STAGING/deploy"
          cp artifacts/linux-x64/p2l            "$STAGING/bin/"
          cp artifacts/linux-x64/p2l-client     "$STAGING/bin/"
          cp artifacts/linux-x64/libe_sqlite3.so "$STAGING/bin/" 2>/dev/null || true
          cp appsettings.json                    "$STAGING/config/"
          cp deploy/install.sh                   "$STAGING/deploy/" 2>/dev/null || true
          cp deploy/p2l.service                  "$STAGING/deploy/" 2>/dev/null || true
          cp deploy/p2l-client.service           "$STAGING/deploy/" 2>/dev/null || true
          mkdir -p dist
          tar -czf "dist/p2l-${VERSION}-linux-x64.tar.gz" -C "dist/staging" "p2l-${VERSION}-linux-x64"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: p2l-${{ env.VERSION }}-linux-x64
          path: dist/p2l-*-linux-x64.tar.gz
          retention-days: 30

  # ── Linux arm64 ────────────────────────────────────────────────────────────
  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    if: |
      github.event_name == 'push' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'linux'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
