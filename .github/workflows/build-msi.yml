# .github/workflows/build-msi.yml
# Build the P2L Windows MSI installer.
# Triggered manually (workflow_dispatch) or on tags matching v*.
#
# Run from macOS / any OS via GitHub CLI:
#   gh workflow run build-msi.yml -f version=1.0.0 -f platform=x64
#
# Or push a tag:
#   git tag v1.0.0 && git push origin v1.0.0

name: Build P2L Windows MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      platform:
        description: "Target platform"
        required: true
        default: x64
        type: choice
        options: [x64, arm64]

  push:
    tags:
      - "v*"

jobs:
  build-msi:
    name: Build MSI (win-${{ github.event.inputs.platform || 'x64' }})
    runs-on: windows-latest

    env:
      PLATFORM: ${{ github.event.inputs.platform || 'x64' }}
      VERSION:  ${{ github.event.inputs.version  || '1.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install Python client dependencies
        run: pip install -r client/requirements.txt
        working-directory: ${{ github.workspace }}

      - name: Install WiX
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext
          wix extension add WixToolset.Util.wixext

      - name: Build .NET binary (Native AOT win-${{ env.PLATFORM }})
        run: |
          dotnet publish src/P2L.CLI `
            -c Release `
            -r win-$env:PLATFORM `
            --self-contained true `
            -p:PublishAot=true `
            -p:PublishSingleFile=false `
            -p:AssemblyVersion=$env:VERSION `
            -o artifacts/win-$env:PLATFORM

      - name: Build p2l-client.exe (PyInstaller)
        run: |
          pyinstaller --onefile --name p2l-client `
            --distpath artifacts/win-$env:PLATFORM `
            --workpath .pyinstaller-work `
            --specpath .pyinstaller-work `
            client/run.py

      - name: Verify artifacts
        run: |
          @('p2l.exe','p2l-client.exe','e_sqlite3.dll') | ForEach-Object {
            $path = "artifacts/win-$env:PLATFORM/$_"
            if (-not (Test-Path $path)) { throw "Missing: $path" }
            $mb = [math]::Round((Get-Item $path).Length/1MB, 1)
            Write-Host "  $_ — ${mb} MB"
          }

      - name: Build MSI
        run: |
          dotnet build deploy/P2L.Installer/P2L.Installer.wixproj `
            -c Release `
            -p:Platform=$env:PLATFORM `
            -p:ProductVersion=$env:VERSION `
            -p:BinaryPath=$(Resolve-Path "artifacts/win-$env:PLATFORM") `
            -p:ConfigPath=$(Resolve-Path "deploy/P2L.Installer/Assets") `
            -p:LicenseRtf=$(Resolve-Path "deploy/P2L.Installer/Assets/License.rtf") `
            -o dist

      - name: List output
        run: Get-ChildItem dist/*.msi | ForEach-Object { Write-Host "$($_.Name) — $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2L-${{ env.VERSION }}-win-${{ env.PLATFORM }}
          path: dist/*.msi
          retention-days: 30

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          name: "P2L ${{ env.VERSION }}"
          body: |
            ## Pick2Light ${{ env.VERSION }}

            **Windows installer** (MSI) — installs:
            - P2L Bridge Service (`p2l.exe`)
            - P2L Web Dashboard on http://localhost:8765 (`p2l-client.exe`)
            - SQLite native runtime (`e_sqlite3.dll`)

            **Silent install:**
            ```cmd
            msiexec /i P2L-${{ env.VERSION }}-x64.msi /qn
            ```
